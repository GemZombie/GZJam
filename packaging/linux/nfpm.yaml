# The .deb, .rpm and Arch package (#249), built by nFPM from a staged Linux publish folder:
#   cd <folder from package.sh> && VERSION=1.2.0 nfpm package --config nfpm.yaml --packager deb --target <file>
# Each installs GZJam in /opt/gzjam, a `gzjam` command, the launcher entry and icon. Removing the
# package leaves settings (~/.config/GZJam), the library database (~/.local/share/GZJam) and music.
name: gzjam
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: sound
priority: optional
maintainer: Jesse Gearhart <gemzombie@gmail.com>
description: |-
  A simple DJ app for social dance nights
  Two or four decks, a queue, a preview player in the headphones, playlists and a
  history of every night, for DJs who play whole songs and choose for the floor.
vendor: GemZombie
homepage: https://github.com/GemZombie/GZJam
license: MIT AND LicenseRef-BASS

# What a minimal system might lack, found by installing each package in clean Ubuntu, Debian,
# Fedora, openSUSE and Arch containers and starting GZJam under Xvfb (ldd misses these: .NET and
# Avalonia open them as they go):
#   ALSA for sound
#   OpenSSL and the CA certificates for the update check (.NET aborts at startup without OpenSSL)
#   fontconfig and a font: Avalonia stops without one (DejaVu Sans by its font name on Fedora and
#   openSUSE alike; ttf-font on Arch)
#   X11, ICE and SM for the window
# The rest (glibc, libstdc++, zlib) every system has.
# Debian and Ubuntu name ICU by its version (libicu74, libicu76...), so a .deb that asked for it
# would stop installing on the next release; every desktop has it already (libxml2 needs it).
# The .rpm asks for libraries, not packages, as Fedora and openSUSE name their packages differently;
# ICU by package (libicu on Fedora, icu on both), its library being named by version too.
overrides:
  deb:
    depends:
      - libasound2t64 | libasound2
      - ca-certificates
      - libssl3t64 | libssl3 | libssl1.1
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
  rpm:
    depends:
      - libasound.so.2()(64bit)
      - font(dejavusans)
      - ca-certificates
      - (libicu or icu)
      - libssl.so.3()(64bit)
      - libfontconfig.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
  archlinux:
    depends:
      - alsa-lib
      - openssl
      - ca-certificates
      - fontconfig
      - ttf-font
      - icu
      - libx11
      - libice
      - libsm

contents:
  - src: ./app
    dst: /opt/gzjam
    type: tree

  - src: /opt/gzjam/GZJam
    dst: /usr/bin/gzjam
    type: symlink

  - src: ./gzjam.desktop
    dst: /usr/share/applications/gzjam.desktop
    file_info:
      mode: 0644

  - src: ./gzjam.png
    dst: /usr/share/icons/hicolor/256x256/apps/gzjam.png
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/gzjam/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/licenses/gzjam/LICENSE
    packager: rpm
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/licenses/gzjam/LICENSE
    packager: archlinux
    file_info:
      mode: 0644
  - src: ./app/THIRD-PARTY-NOTICES.txt
    dst: /usr/share/licenses/gzjam/THIRD-PARTY-NOTICES.txt
    packager: archlinux
    file_info:
      mode: 0644
