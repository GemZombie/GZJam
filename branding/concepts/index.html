<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GZJam logo concepts</title>
<style>
  body { font-family: var(--font-sans, system-ui, sans-serif); }
  .wrap { display: flex; flex-direction: column; gap: 30px; padding: 2px 0 8px; }
  .concept h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .concept p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; color: var(--muted-foreground, #8b93a1); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel { border-radius: var(--radius, 8px); padding: 18px; display: flex; flex-direction: column; gap: 20px; }
  .dark { background: #0E1116; color: #6B7482; }
  .light { background: #EEF0F3; color: #7A8290; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; }
  .sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 10px var(--font-mono, monospace); }
  .sizes svg, .lockup svg { display: block; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .dark .wm { color: #E8ECF2; }
  .light .wm { color: #151920; }
  @media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div class="wrap" id="page"></div>
<script>
// Letters for the wordmark, each on a 20-unit grid (stroke 3.2, so 0.4..19.6 tall).
const L = {
  G: "M15.66,4.34 A8,8 0 1 0 18,10 H11",
  Z: "M3,2 H17 L3,18 H17",
  J: "M15,0.4 V12 A6,6 0 0 1 3,12",
  A: "M3,19.6 V9 A7,7 0 0 1 17,9 V19.6 M3,12.5 H17",
  M: "M3,19.6 V2 L10,12 L17,2 V19.6",
};
const letters = (word, xs, extra = "") =>
  [...word].map((c, i) => `<path transform="translate(${xs[i]} 0)" d="${L[c]}" ${extra}/>`).join("");

const C = { bg: "#0E1116", ink: "#E6EAF0", accent: "#7FA3CF", deck1: "#36C2DC", deck2: "#EEA23A", onAir: "#F04444" };

// Concept B: the app's waveform wrapped into a G.
// Bars are mirrored around the ring, like a deck's waveform around its center line.
function waveG() {
  const cx = 32, cy = 32, R = 18, step = 9, last = 306;
  let s = "";
  for (let deg = 2 * step; deg <= last; deg += step) {
    const i = deg / step;
    const envelope = 0.55 + 0.45 * Math.sin(i * 0.42 + 0.6) ** 2;
    const h = 1.6 + 5.2 * envelope * [1, 0.72, 0.9, 0.62][i % 4];
    const a = deg * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
    const col = deg <= 160 ? C.deck1 : "#C3CBD6";
    s += `<line x1="${(cx + (R - h) * cos).toFixed(2)}" y1="${(cy + (R - h) * sin).toFixed(2)}" x2="${(cx + (R + h) * cos).toFixed(2)}" y2="${(cy + (R + h) * sin).toFixed(2)}" stroke="${col}" stroke-width="1.9"/>`;
  }
  // The G's bar: from the ring's end, in toward the middle.
  s += `<line x1="33" y1="32" x2="${cx + R + 5}" y2="32" stroke="${C.deck1}" stroke-width="3.4"/>`;
  return s;
}

function ladder() {
  let s = "";
  for (let x = 12; x <= 52; x += 4) {
    const major = x === 12 || x === 32 || x === 52;
    s += `<line x1="${x}" y1="${major ? 18 : 21}" x2="${x}" y2="25"/><line x1="${x}" y1="39" x2="${x}" y2="${major ? 46 : 43}"/>`;
  }
  return `<g stroke="#4A5260" stroke-width="1">${s}</g>`;
}

document.getElementById("defs").innerHTML = `
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E232C"/><stop offset="1" stop-color="#0C0F14"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F6F9"/><stop offset="1" stop-color="#9EA7B3"/></linearGradient>
  <linearGradient id="keytop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C323D"/><stop offset="1" stop-color="#1B1F27"/></linearGradient>

  <symbol id="tilebg" viewBox="0 0 64 64">
    <rect x="1" y="1" width="62" height="62" rx="13" fill="url(#tile)" stroke="#2B313C"/>
  </symbol>

  <symbol id="platter" viewBox="0 0 64 64">
    <use href="#tilebg"/>
    <circle cx="32" cy="32" r="22.5" fill="none" stroke="#252B36" stroke-width="4.5"/>
    <circle cx="32" cy="32" r="22.5" fill="none" stroke="${C.accent}" stroke-width="4.5" stroke-dasharray="106 400" transform="rotate(-90 32 32)"/>
    <circle cx="32" cy="32" r="17" fill="#07090C"/>
    <g fill="none" stroke="#1D222B" stroke-width="0.7"><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="12.8"/><circle cx="32" cy="32" r="10.6"/></g>
    <circle cx="32" cy="32" r="6.2" fill="${C.ink}"/>
    <circle cx="32" cy="32" r="1.5" fill="${C.bg}"/>
    <rect x="31.1" y="16.2" width="1.8" height="5" fill="${C.ink}"/>
  </symbol>

  <symbol id="waveg" viewBox="0 0 64 64">
    <use href="#tilebg"/>
    ${waveG()}
  </symbol>

  <symbol id="xfader" viewBox="0 0 64 64">
    <use href="#tilebg"/>
    ${ladder()}
    <rect x="8" y="28.5" width="48" height="7" rx="1.2" fill="#05070A"/>
    <rect x="9" y="29.6" width="23" height="4.8" fill="${C.deck1}"/>
    <rect x="32" y="29.6" width="23" height="4.8" fill="${C.deck2}"/>
    <rect x="27.5" y="20" width="9" height="24" rx="1.6" fill="url(#metal)" stroke="#0A0C10" stroke-width="0.8"/>
    <line x1="32" y1="21" x2="32" y2="43" stroke="#262B34" stroke-width="1.3"/>
  </symbol>

  <symbol id="key" viewBox="0 0 64 64">
    <rect x="1" y="1" width="62" height="62" rx="11" fill="#0A0C10"/>
    <rect x="3" y="3" width="58" height="57" rx="9" fill="#14171D"/>
    <rect x="6" y="5" width="52" height="49" rx="7" fill="url(#keytop)" stroke="#3A414E" stroke-width="0.8"/>
    <rect x="27" y="10.5" width="10" height="2.6" rx="1" fill="${C.onAir}"/>
    <g transform="translate(12 20)" fill="none" stroke="${C.ink}" stroke-width="4.2" stroke-miterlimit="1.5">
      ${letters("GZ", [0, 22])}
    </g>
  </symbol>

  <symbol id="wordmark" viewBox="0 0 104 20">
    <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-miterlimit="1.5">
      ${letters("GZJAM", [0, 22, 42, 62, 84])}
    </g>
  </symbol>
</defs>`;

const icon = (id, size) => `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
const wordmark = h => `<svg class="wm" height="${h}" width="${h * 104 / 20}" viewBox="0 0 104 20"><use href="#wordmark"/></svg>`;

const concepts = [
  { id: "platter", name: "A · Platter", text: "Today's icon, made precise: the record, its cue mark, and the progress ring every deck shows. The safe choice: it already means GZJam to anyone who's used it." },
  { id: "waveg", name: "B · Waveform G", text: "The deck's waveform wrapped into a ring that opens into a G. The colored part is what's been played. It reads as a G at icon sizes and as music up close." },
  { id: "xfader", name: "C · Crossfader", text: "A crossfader cap between Deck 1's and Deck 2's colors, on a ladder scale. Says DJ in one shape; the most hardware-like." },
  { id: "key", name: "D · GZ key", text: "A raised hardware key with the GZ initials and a red on-air LED, like a button on a mixer. Typographic, so the name does the work." },
];

document.getElementById("page").innerHTML = concepts.map(c => {
  const panel = cls => `
    <div class="panel ${cls}">
      <div class="sizes">${[96, 48, 32, 16].map(s => `<figure>${icon(c.id, s)}<figcaption>${s}</figcaption></figure>`).join("")}</div>
      <div class="lockup">${icon(c.id, 40)}${wordmark(18)}</div>
    </div>`;
  return `<section class="concept"><h2>${c.name}</h2><p>${c.text}</p><div class="pair">${panel("dark")}${panel("light")}</div></section>`;
}).join("");
</script>
</body>
</html>
