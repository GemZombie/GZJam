# Check that GZJam builds and its tests pass on each OS. Day to day, builds and tests run locally;
# this runs at important times: by hand (Actions › CI › Run workflow) and on pull requests.
# No packages here; those come from release.yml.
#
# A pull request is checked on all three systems, and must pass before it's merged (the repo's
# rules for main); a run by hand includes macOS unless unticked. It also runs for pull requests that
# only touch docs: a required check that never runs would leave them waiting for ever.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Include macOS
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || inputs.macos) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'lib/bass/Bass.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build GZJam.slnx -c Release

      - name: Test
        run: dotnet test GZJam.slnx -c Release --no-build

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: tests/*/bin/Release/net10.0/TestResults/
          retention-days: 7
          if-no-files-found: ignore
